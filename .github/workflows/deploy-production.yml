name: Deploy to Production
on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (Service Account)
        run: |
          echo '${{ secrets.GCP_SA_KEY_PRODUCTION }}' > "${{ runner.temp }}/gcp-sa.json"
          test -s "${{ runner.temp }}/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ runner.temp }}/gcp-sa.json" >> "$GITHUB_ENV"
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Verify Firebase CLI
        run: firebase --version
      - name: Deploy to Firebase Production
        run: firebase deploy --only hosting:app,firestore --project production
